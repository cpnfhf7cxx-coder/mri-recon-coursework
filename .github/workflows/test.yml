name: sanity-check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python tools/make_phantom.py
      - run: python demo.py --data-root data/phantom --split val --method tv --steps 3 --out outputs/ci
